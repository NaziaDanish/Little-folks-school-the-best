<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact Us - The Little Folks School</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
   
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
        }

        header {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: rgb(253, 246, 246);
        }

        .gif-header {
            width: 100%;
            height: 100%;
            object-fit: contain;
            max-width: 100%;
            max-height: 100%;
            display: block;
        }


        @media (max-width: 575.98px) {
            header {
                height: 60vh;
            }
        }

        @media (min-width: 576px) and (max-width: 991.98px) {
            header {
                height: 80vh;
            }
        }

        @media (min-width: 992px) {
            header {
                height: 100vh;
            }
        }

        .back-btn {
            display: block;
            text-align: center;
            margin-top: 50px;
        }

        .back-btn a {
            background-color: #b30000;
            color: white;
            padding: 12px 30px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .back-btn a:hover {
            background-color: #990000;
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <header>
        <img src="assets/header sectin.gif" alt="School Header" class="gif-header">
    </header>


    <div class="container contact-container shadow">
        <h2 class="mb-4 text-center" style="color:#800000;">Contact Us</h2>
        <form id="contactForm" novalidate>
            <div class="mb-3">
                <label for="name" class="form-label fw-semibold">Full Name</label>
                <input type="text" class="form-control" id="name" placeholder="Enter your full name" required />
                <div class="invalid-feedback">Please enter your name.</div>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label fw-semibold">Email Address</label>
                <input type="email" class="form-control" id="email" placeholder="Enter your email" required />
                <div class="invalid-feedback">Please enter a valid email.</div>
            </div>

            <div class="mb-3">
                <label for="subject" class="form-label fw-semibold">Subject</label>
                <input type="text" class="form-control" id="subject" placeholder="Subject of your message" required />
                <div class="invalid-feedback">Subject cannot be empty.</div>
            </div>

            <div class="mb-3">
                <label for="message" class="form-label fw-semibold">Message</label>
                <textarea class="form-control" id="message" rows="5" placeholder="Write your message here..."
                    required></textarea>
                <div class="invalid-feedback">Please enter your message.</div>
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-custom">Send Message</button>
            </div>
        </form>
    </div>

    <div class="back-btn">
        <a href="index.html">← Back to Home</a>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>

        (function () {
            'use strict';
            var form = document.getElementById('contactForm');
            form.addEventListener('submit', function (event) {
                if (!form.checkValidity()) {
                    event.preventDefault();
                    event.stopPropagation();
                }
                form.classList.add('was-validated');
            }, false);
        })();
    </script>

</body>

</html>
