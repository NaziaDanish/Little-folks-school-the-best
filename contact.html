<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact Us - The Little Folks School</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <div class="header-image">
        <img src="assets/header sectin.gif" alt="School Header" class="gif-header">
    </div>

    <div class="container contact-container shadow">
        <h2 class="mb-4 text-center" style="color:#800000;">Contact Us</h2>
        <form id="contactForm" novalidate>
            <div class="mb-3">
                <label for="name" class="form-label fw-semibold">Full Name</label>
                <input type="text" class="form-control" id="name" placeholder="Enter your full name" required />
                <div class="invalid-feedback">Please enter your name.</div>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label fw-semibold">Email Address</label>
                <input type="email" class="form-control" id="email" placeholder="Enter your email" required />
                <div class="invalid-feedback">Please enter a valid email.</div>
            </div>

            <div class="mb-3">
                <label for="subject" class="form-label fw-semibold">Subject</label>
                <input type="text" class="form-control" id="subject" placeholder="Subject of your message" required />
                <div class="invalid-feedback">Subject cannot be empty.</div>
            </div>

            <div class="mb-3">
                <label for="message" class="form-label fw-semibold">Message</label>
                <textarea class="form-control" id="message" rows="5" placeholder="Write your message here..."
                    required></textarea>
                <div class="invalid-feedback">Please enter your message.</div>
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-custom">Send Message</button>
            </div>
        </form>
    </div>
    <a href="index.html" class="btn custom-home-btn mt-4">Back to Home</a>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>

        (function () {
            'use strict';
            var form = document.getElementById('contactForm');
            form.addEventListener('submit', function (event) {
                if (!form.checkValidity()) {
                    event.preventDefault();
                    event.stopPropagation();
                }
                form.classList.add('was-validated');
            }, false);
        })();
    </script>

</body>

</html>
